<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Hub Créatif</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2c3e50;
        }

        .hub-container {
            text-align: center;
            max-width: 900px;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #5d6d7e;
            margin-bottom: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            border-color: #3498db;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin: 10px 0;
            font-size: 1.4rem;
        }

        .card p {
            font-size: 0.95rem;
            color: #7f8c8d;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <h1>🚀 Mon Hub Créatif</h1>
        <p class="subtitle">Tous tes outils de réflexion réunis au même endroit.</p>

        <div class="grid">
            <a href="workspace.html" class="card">
                <div class="icon">🛠️</div>
                <h2>Espace Créatif</h2>
                <p>Combine l'éditeur de texte et la carte mentale intuitive pour organiser tes idées.</p>
            </a>

            <a href="communaute.html" class="card">
                <div class="icon">🌐</div>
                <h2>Communauté</h2>
                <p>Partage tes travaux, pose des questions et collabore avec les autres membres.</p>
            </a>
        </div>
    </div>

</body>
</html>
