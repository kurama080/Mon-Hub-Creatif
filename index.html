<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Hub Créatif</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7f6;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* BOUTON POUR OUVRIR LE MENU */
        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 24px;
            background: #2c3e50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 1000;
            transition: 0.3s;
        }
        .menu-btn:hover { background: #34495e; transform: scale(1.05); }

        /* LA BARRE LATÉRALE (SIDEBAR) */
        .sidebar {
            position: fixed;
            top: 0;
            left: -300px; /* Cachée par défaut */
            width: 280px;
            height: 100%;
            background: #2c3e50;
            color: white;
            transition: 0.4s ease;
            z-index: 999;
            padding-top: 80px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.2);
        }

        .sidebar.open {
            left: 0; /* On l'affiche */
        }

        .sidebar h2 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #3498db;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            padding: 15px 25px;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            transition: 0.3s;
            border-left: 4px solid transparent;
        }

        .sidebar a:hover {
            background: #34495e;
            border-left: 4px solid #3498db;
            padding-left: 35px;
        }

        .sidebar .icon { margin-right: 15px; font-size: 20px; }

        /* CONTENU PRINCIPAL */
        .main-content {
            text-align: center;
            transition: 0.4s;
        }

        h1 { font-size: 3rem; color: #2c3e50; margin: 0; }
        p { color: #7f8c8d; font-size: 1.2rem; }

        /* OVERLAY (Pour fermer en cliquant à côté) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 998;
        }
        .overlay.show { display: block; }
    </style>
</head>
<body>

    <button class="menu-btn" onclick="toggleMenu()">☰ Menu</button>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="sidebar" id="sidebar">
        <h2>🚀 NAVIGATION</h2>
        <a href="workspace.html">
            <span class="icon">🛠️</span> Espace Créatif
        </a>
        <a href="communaute.html">
            <span class="icon">🌐</span> Communauté
        </a>
        <a href="#" onclick="toggleMenu()" style="margin-top: 50px; color: #e74c3c;">
            <span class="icon">✖</span> Fermer
        </a>
    </nav>

    <div class="main-content" id="content">
        <h1>Bienvenue</h1>
        <p>Clique sur le menu en haut à gauche pour explorer tes outils.</p>
    </div>

    <script>
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }
    </script>

</body>
</html>
