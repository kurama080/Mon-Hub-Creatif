<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Espace Créatif - Complet</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; background-color: #f0f2f5; }
        .navbar { height: 55px; background-color: #2c3e50; display: flex; align-items: center; padding: 0 20px; color: white; z-index: 100; justify-content: space-between; }
        .nav-left, .nav-right { display: flex; align-items: center; gap: 10px; }
        .btn-nav { color: white; text-decoration: none; border: 1px solid white; padding: 5px 12px; border-radius: 5px; font-size: 14px; cursor: pointer; background: none; }
        .btn-publier { background: #e67e22; border: none; font-weight: bold; }
        
        .main-container { display: flex; height: calc(100vh - 55px); }
        .editor-container { width: 30%; background: white; border-right: 2px solid #ddd; display: flex; flex-direction: column; padding: 15px; }
        textarea { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 10px; resize: none; outline: none; font-size: 16px; }

        .mindmap-container { width: 70%; position: relative; overflow: hidden; background: #f8f9fa; }
        #line-canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }

        .node {
            position: absolute; background: white; border: 2px solid #3498db; border-radius: 50px;
            padding: 10px 20px; min-width: 80px; text-align: center; cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-weight: bold; z-index: 5; display: flex; align-items: center;
        }
        .node.root { border: 3px solid #2c3e50; background-color: #ecf0f1; }
        .node:hover .node-actions { display: flex; }
        .node-actions { position: absolute; top: -25px; right: 0; display: none; gap: 5px; }
        .action-btn { width: 22px; height: 22px; border-radius: 50%; border: none; color: white; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .add-btn { background: #2ecc71; }
        .del-btn { background: #e74c3c; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="index.html" class="btn-nav">← Hub</a>
        <button onclick="saveLocal()" class="btn-nav">💾 Sauver</button>
    </div>
    <div class="nav-right">
        <button onclick="publishProject()" class="btn-nav btn-publier">🚀 Publier sur la Commu</button>
    </div>
</div>

<div class="main-container">
    <div class="editor-container">
        <textarea id="editor" placeholder="Écris tes notes ici..."></textarea>
    </div>
    <div class="mindmap-container" id="canvas-area">
        <canvas id="line-canvas"></canvas>
    </div>
</div>

<script>
    const canvasArea = document.getElementById('canvas-area');
    const lineCanvas = document.getElementById('line-canvas');
    const ctx = lineCanvas.getContext('2d');
    let nodes = [];

    function resizeCanvas() {
        lineCanvas.width = canvasArea.offsetWidth;
        lineCanvas.height = canvasArea.offsetHeight;
        drawLines();
    }
    window.addEventListener('resize', resizeCanvas);

    function createNode(text, x, y, parentNode = null, isRoot = false) {
        const nodeObj = { id: Date.now() + Math.random(), parent: parentNode, element: document.createElement('div') };
        const el = nodeObj.element;
        el.className = isRoot ? 'node root' : 'node';
        el.style.left = x + 'px'; el.style.top = y + 'px';

        const span = document.createElement('span');
        span.contentEditable = true; span.innerText = text;
        el.appendChild(span);

        const actions = document.createElement('div');
        actions.className = 'node-actions';
        const addBtn = document.createElement('button');
        addBtn.className = 'action-btn add-btn'; addBtn.innerText = '+';
        addBtn.onclick = (e) => { e.stopPropagation(); createNode("Idée", el.offsetLeft + 150, el.offsetTop + 50, nodeObj); };
        actions.appendChild(addBtn);

        if (!isRoot) {
            const delBtn = document.createElement('button');
            delBtn.className = 'action-btn del-btn'; delBtn.innerText = '×';
            delBtn.onclick = (e) => { e.stopPropagation(); removeNodeWithChildren(nodeObj); drawLines(); };
            actions.appendChild(delBtn);
        }

        el.appendChild(actions);
        makeDraggable(el, nodeObj);
        canvasArea.appendChild(el);
        nodes.push(nodeObj);
        drawLines();
    }

    function removeNodeWithChildren(nodeToDelete) {
        nodes.filter(n => n.parent === nodeToDelete).forEach(child => removeNodeWithChildren(child));
        nodeToDelete.element.remove();
        nodes = nodes.filter(n => n !== nodeToDelete);
    }

    function drawLines() {
        ctx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);
        ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 2;
        nodes.forEach(node => {
            if (node.parent) {
                const startX = node.parent.element.offsetLeft + (node.parent.element.offsetWidth / 2);
                const startY = node.parent.element.offsetTop + (node.parent.element.offsetHeight / 2);
                const endX = node.element.offsetLeft + (node.element.offsetWidth / 2);
                const endY = node.element.offsetTop + (node.element.offsetHeight / 2);
                ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(endX, endY); ctx.stroke();
            }
        });
    }

    function makeDraggable(el, nodeObj) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        el.onmousedown = (e) => {
            if (e.target.contentEditable === "true" || e.target.tagName === 'BUTTON') return;
            pos3 = e.clientX; pos4 = e.clientY;
            document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
            document.onmousemove = (e) => {
                pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
                pos3 = e.clientX; pos4 = e.clientY;
                el.style.top = (el.offsetTop - pos2) + "px"; el.style.left = (el.offsetLeft - pos1) + "px";
                drawLines();
            };
        };
    }

    // --- FONCTIONS DE SAUVEGARDE ET PUBLICATION ---

    function saveLocal() {
        const projectData = serializeProject();
        localStorage.setItem('projet_sauvegarde', JSON.stringify(projectData));
        alert("Sauvegardé sur ton navigateur !");
    }

    function serializeProject() {
        return {
            text: document.getElementById('editor').value,
            nodes: nodes.map(n => ({
                text: n.element.querySelector('span').innerText,
                x: n.element.offsetLeft,
                y: n.element.offsetTop,
                isRoot: n.element.classList.contains('root'),
                parentId: n.parent ? n.parent.id : null,
                id: n.id
            }))
        };
    }

    function publishProject() {
        const title = prompt("Titre de la publication :");
        if (!title) return;
        
        const projectData = serializeProject();
        const publication = {
            id: Date.now(),
            title: title,
            user: "Explorateur",
            date: new Date().toLocaleDateString(),
            data: projectData
        };

        let commuPosts = JSON.parse(localStorage.getItem('commu_posts')) || [];
        commuPosts.unshift(publication);
        localStorage.setItem('commu_posts', JSON.stringify(commuPosts));
        
        alert("Projet publié sur la communauté !");
        window.location.href = "communaute.html";
    }

    // --- CHARGEMENT D'UN PROJET SI EXISTANT ---
    window.onload = () => {
        resizeCanvas();
        const dataToOpen = localStorage.getItem('project_to_open');
        if (dataToOpen) {
            const project = JSON.parse(dataToOpen);
            document.getElementById('editor').value = project.text;
            // Reconstruction simplifiée pour l'exemple
            project.nodes.forEach(n => createNode(n.text, n.x, n.y, null, n.isRoot));
            localStorage.removeItem('project_to_open');
        } else {
            createNode("SUJET CENTRAL", canvasArea.offsetWidth / 2 - 50, canvasArea.offsetHeight / 2 - 20, null, true);
        }
    };
</script>
</body>
</html>
